<svg viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="600" fill="#FFF8E6"/>
  
  <!-- Left: Computer -->
  <g transform="translate(100, 150)">
    <rect x="0" y="40" width="120" height="100" fill="#D96704" rx="8"/>
    <rect x="10" y="50" width="100" height="70" fill="#8B4513"/>
    <path d="M 30 130 Q 40 135 50 130 M 50 130 Q 60 135 70 130 M 70 130 Q 80 135 90 130" stroke="#8B4513" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Center: ReCo Logo and Gears -->
  <g transform="translate(400, 150)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#F2B705" stroke-width="3"/>
    <text x="50" y="65" font-size="40" font-weight="bold" text-anchor="middle" fill="#F2B705">ReCo</text>
    
    <!-- Gears -->
    <circle cx="20" cy="30" r="15" fill="none" stroke="#D96704" stroke-width="2"/>
    <circle cx="80" cy="30" r="15" fill="none" stroke="#D96704" stroke-width="2"/>
    <circle cx="20" cy="70" r="15" fill="none" stroke="#D96704" stroke-width="2"/>
    <circle cx="80" cy="70" r="15" fill="none" stroke="#D96704" stroke-width="2"/>
  </g>
  
  <!-- Right: Robot -->
  <g transform="translate(750, 150)">
    <rect x="0" y="0" width="80" height="100" fill="#D96704" rx="8"/>
    <circle cx="15" cy="15" r="8" fill="#F2B705"/>
    <circle cx="65" cy="15" r="8" fill="#F2B705"/>
    <rect x="10" y="30" width="60" height="40" fill="#F2B705"/>
    <text x="40" y="55" font-size="12" text-anchor="middle" fill="#D96704">reused</text>
  </g>
</svg>